[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sketchlogic-eval"
version = "0.1.0"
description = "SketchLogic extraction-quality evaluation: score predicted GraphDocuments against gold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-jsonschema",
]

[project.scripts]
sketchlogic-eval = "sketchlogic_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sketchlogic_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

