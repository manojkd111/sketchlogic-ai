name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m ruff format --check .
      - run: .venv/bin/python -m mypy app scripts
      - run: .venv/bin/python -m pytest

  python-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { pkg: ml, mod: sketchlogic_ml }
          - { pkg: evaluations, mod: sketchlogic_eval }
    defaults: { run: { working-directory: "${{ matrix.pkg }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m ruff format --check .
      - run: .venv/bin/python -m mypy ${{ matrix.mod }}
      - run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Backend venv
        working-directory: backend
        run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev]"
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install, browsers, build
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Playwright (starts backend on :8000 with mock provider, Next on :3000)
        working-directory: frontend
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
